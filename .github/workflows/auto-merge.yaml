name: Dependabot auto-merge

# Dependabot pull requests run with read-only default permissions, so this
# needs its own workflow with elevated permissions rather than a step tacked
# onto test.yaml - see GitHub's docs on automating Dependabot:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Dependabot has to have opened the pull request, and triggered this run:
    # a push by anyone else triggers one as that user, which cannot read the
    # token. Auto-merge enabled before then carries over.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    steps:
    # This only *enables* GitHub's native auto-merge, which then waits for the
    # required status checks on whatever the head commit ends up being. That
    # needs "Allow auto-merge" turned on for the repository and the `nix` job
    # from test.yaml set as a required check on main, or it is a no-op.
    #
    # The merge runs under a personal access token because GITHUB_TOKEN has no
    # permission that covers workflow files - there is no `workflows` key to
    # grant - so it cannot merge the github-actions bumps, whose whole content
    # is a change under .github/workflows. The token lives in Dependabot
    # secrets, since these runs cannot read Actions secrets. As a fine-grained
    # token for this repository it needs read and write on contents, pull
    # requests and workflows.
    - name: Enable auto-merge
      run: gh pr merge --auto --squash "$PR_URL"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
